name: quote-approval-ek1
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: quote_approval
      POSTGRES_USER: quote_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote_app -d quote_approval"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: quote_approval
      DB_USER: quote_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m app.init_db && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"]
volumes:
  postgres_data:
