# Dedicated disposable PostgreSQL; never connect these tests to the demo volume.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: core_tests
      POSTGRES_USER: core_test
      POSTGRES_PASSWORD: local-test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_test -d core_tests"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build: .
    user: "${LOCAL_UID:?Set LOCAL_UID}:${LOCAL_GID:?Set LOCAL_GID}"
    environment:
      CORE_TEST_DATABASE_URL: postgresql+psycopg://core_test:local-test-only-password@db:5432/core_tests
    volumes:
      - "${CORE_REPORT_DIR:?Set CORE_REPORT_DIR}:/reports"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m pytest -v -p no:cacheprovider --junitxml=/reports/test-results.xml && python scripts/check_core_results.py /reports/test-results.xml"]
