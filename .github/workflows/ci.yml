name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Build Docker image
        run: docker build -t quote-approval-service:${{ github.sha }} .

      - name: Record checked commit
        if: always()
        run: git rev-parse HEAD > checked-commit.txt

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            checked-commit.txt