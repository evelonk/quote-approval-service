name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: core_tests
          POSTGRES_USER: core_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_test -d core_tests"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          CORE_TEST_DATABASE_URL: postgresql+psycopg://core_test:ci-test-only-password@localhost:5432/core_tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Build Docker image
        run: docker build -t quote-approval-service:${{ github.sha }} .

      - name: Record checked commit
        if: always()
        run: git rev-parse HEAD > checked-commit.txt

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            checked-commit.txt
